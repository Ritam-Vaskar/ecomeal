version: '3.9'
services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
  redis:
    image: redis:7
    ports:
      - '6379:6379'
  backend:
    build:
      context: ./apps/backend
    env_file:
      - ./apps/backend/.env
    ports:
      - '4000:4000'
    depends_on:
      - mongo
      - redis
  frontend:
    build:
      context: ./apps/frontend
    env_file:
      - ./apps/frontend/.env
    ports:
      - '3000:3000'
    depends_on:
      - backend
volumes:
  mongo_data:
